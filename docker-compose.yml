services:
  db:
    image: postgres:17
    container_name: mtcg-postgres
    environment:
      POSTGRES_DB: mtcg
      POSTGRES_USER: ${MTCG_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MTCG_DB_PASSWORD:-0000}
    ports:
      - "127.0.0.1:5432:5432"   # nur lokal erreichbar
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mtcg"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
