name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mtcg
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mtcg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MTCG_DB_URL: jdbc:postgresql://localhost:5432/mtcg
      MTCG_DB_USER: postgres
      MTCG_DB_PASSWORD: ci-password

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Create schema
        run: psql -v ON_ERROR_STOP=1 -f init.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: ci-password
          PGDATABASE: mtcg
      # Unit- und Integrationstests; die Integrationstests legen ihre Testdaten selbst an
      - name: Build and test
        run: mvn -B test
      - name: Make sure integration tests ran
        run: |
          grep -Eq 'Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0' \
            target/surefire-reports/main.Controller.CardControllerIntegrationTest.txt \
            || { echo "Integration tests were skipped"; exit 1; }
